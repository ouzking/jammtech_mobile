name: jammtech
description: "JammTech — La paix dans votre poche. Sécurité personnelle, alertes SOS et maison connectée."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.6.0
  geolocator: ^10.1.0
  animations: ^2.0.7
  image_picker: ^1.0.7
  lottie: ^3.1.0
  flutter_tts: ^3.8.5
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  # < 23 : la v23 exige Android Gradle Plugin 9 et le SDK 37 (le projet est en AGP 8.11).
  flutter_local_notifications: ">=22.0.0 <23.0.0"
  uuid: ^4.6.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  video_player: ^2.14.1
  share_plus: ^13.3.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
